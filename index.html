    // Load from Google Sheets API

        const response = await fetch(

          const headers = data.values[0];
          courierData = data.values.slice(1).map((row, index) => {
            const obj = { no: index + 1 };
            headers.forEach((header, i) => {
              obj[header] = row[i] || '';
            });
            return obj;
          });
          renderDashboard();
        }
      } catch (error) {
        console.error('Error loading from Google Sheets:', error);
        alert('Error loading data. Using sample data instead.');
        courierData = SAMPLE_DATA;
        renderDashboard();
      }
    }
    
    // Calculate statistics
    function calculateStats(data) {
      const totalShipments = data.length;
      const totalInvoiceAmount = data.reduce((sum, item) => sum + (parseFloat(item.invoiceAmount) || 0), 0);
      const totalBoiCharges = data.reduce((sum, item) => sum + (parseFloat(item.boiCharges) || 0), 0);
      const totalCost = totalInvoiceAmount + totalBoiCharges;
      const totalGrossWeight = data.reduce((sum, item) => sum + (parseFloat(item.grossWeight) || 0), 0);
      const avgCostPerShipment = totalShipments > 0 ? totalCost / totalShipments : 0;
      const costPerKg = totalGrossWeight > 0 ? totalCost / totalGrossWeight : 0;
      const pendingPayments = data.filter(item => 
        item.paymentStatus && item.paymentStatus.toString().toUpperCase().includes('PENDING')
      ).length;
      const deliveredCount = data.filter(item => 
        item.status && item.status.toString().toUpperCase().includes('DELIVERED')
      ).length;
      const deliveryRate = totalShipments > 0 ? (deliveredCount / totalShipments) * 100 : 0;
      
      return {
        totalShipments,
        totalCost: totalCost.toFixed(2),
        totalGrossWeight: totalGrossWeight.toFixed(2),
        avgCostPerShipment: avgCostPerShipment.toFixed(2),
        costPerKg: costPerKg.toFixed(2),
        pendingPayments,
        deliveryRate: deliveryRate.toFixed(1)
      };
    }
    
    function getPayerDistribution(data) {
      const payers = {};
      data.forEach(item => {
        const payer = item.payer || 'Unknown';
        payers[payer] = (payers[payer] || 0) + 1;
      });
      return Object.entries(payers).map(([name, value]) => ({
        name,
        value,
        percentage: ((value / data.length) * 100).toFixed(1)
      }));
    }
    
    function getTopCompanies(data, limit = 5) {
      const companies = {};
      data.forEach(item => {
        const company = item.company || 'Unknown';
        if (!companies[company]) {
          companies[company] = { count: 0, amount: 0 };
        }
        companies[company].count += 1;
        companies[company].amount += parseFloat(item.invoiceAmount) || 0;
      });
      return Object.entries(companies)
        .map(([name, data]) => ({
          name: name.length > 30 ? name.substring(0, 30) + '...' : name,
          shipments: data.count,
          amount: data.amount.toFixed(2)
        }))
        .sort((a, b) => b.shipments - a.shipments)
        .slice(0, limit);
    }
    
    function getCourierPerformance(data) {
      const couriers = {};
      data.forEach(item => {
        const service = item.service || 'Unknown';
        if (!couriers[service]) {
          couriers[service] = { service, shipments: 0, totalCost: 0 };
        }
        couriers[service].shipments += 1;
        couriers[service].totalCost += (parseFloat(item.invoiceAmount) || 0) + (parseFloat(item.boiCharges) || 0);
      });
      return Object.values(couriers).map(c => ({
        ...c,
        avgCost: (c.totalCost / c.shipments).toFixed(2),
        marketShare: ((c.shipments / data.length) * 100).toFixed(1)
      }));
    }

      const csv = convertToCSV(courierData);
      const blob = new Blob([csv], { type: 'text/csv' });
      const url = window.URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'courier_data_' + new Date().toISOString().split('T')[0] + '.csv';
      a.click();
      window.URL.revokeObjectURL(url);
    }
    
    function convertToCSV(data) {
      if (data.length === 0) return '';
      const headers = Object.keys(data[0]);
      const rows = data.map(obj => headers.map(header => {
        const value = obj[header] || '';
        return typeof value === 'string' && value.includes(',') ? `"${value}"` : value;
      }).join(','));
      return [headers.join(','), ...rows].join('\n');
    }
    
    // Initialize
    window.onload = loadData;
  </script>
</body>
</html>
